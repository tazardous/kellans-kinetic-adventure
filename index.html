<style>
/* Layout: one full-screen game canvas, letterboxed on a deep space ground; touch buttons float over the corners on phones */
:root{
  --bg:#05051a; --fg:#e9e9ff; --btn:rgba(255,255,255,.14); --btn-on:rgba(255,221,0,.45); --btn-line:rgba(255,255,255,.35);
  --font-pixel:'Press Start 2P','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);margin:0;overflow:hidden;font-family:var(--font-pixel);-webkit-user-select:none;user-select:none;touch-action:none}
#app{position:fixed;inset:0;display:grid;place-items:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;box-shadow:0 0 0 2px #1a1a44,0 10px 40px rgba(0,0,0,.6)}
#touch{position:fixed;inset:0;pointer-events:none}
#touch[hidden]{display:none}
.tb{position:absolute;pointer-events:auto;width:min(17vh,96px);height:min(17vh,96px);border-radius:50%;border:2px solid var(--btn-line);background:var(--btn);
  color:#fff;font:700 min(4.2vh,22px)/1 var(--font-pixel);display:grid;place-items:center;touch-action:none;-webkit-tap-highlight-color:transparent}
.tb.on{background:var(--btn-on);border-color:#ffdd00}
#tL{left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(var(--hud,0px) + 10px + env(safe-area-inset-bottom,0px))}
#tR{left:calc(14px + min(17vh,96px) + 14px + env(safe-area-inset-left,0px));bottom:calc(var(--hud,0px) + 10px + env(safe-area-inset-bottom,0px))}
#tJ{right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(var(--hud,0px) + 10px + env(safe-area-inset-bottom,0px))}
#tB{right:calc(14px + min(17vh,96px) + 14px + env(safe-area-inset-right,0px));bottom:calc(var(--hud,0px) + 10px + env(safe-area-inset-bottom,0px));font-size:min(3vh,14px)}
#tP{right:calc(10px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));width:48px;height:48px;border-radius:12px;font-size:14px}
#tM{right:calc(68px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));width:48px;height:48px;border-radius:12px;font-size:11px}
</style>

</head>

<div id="app"><canvas id="cv" aria-label="Kellan's Kinetic Adventure game"></canvas></div>
<div id="touch" hidden>
  <button class="tb" id="tL" data-k="left" aria-label="Left">◀</button>
  <button class="tb" id="tR" data-k="right" aria-label="Right">▶</button>
  <button class="tb" id="tB" data-k="bomb" aria-label="Bomb">BOMB</button>
  <button class="tb" id="tJ" data-k="jump" aria-label="Jump">▲</button>
  <button class="tb" id="tP" data-k="pause" aria-label="Pause">II</button>

/* ---------------- tiles and collision ---------------- */
const tileAt=(tx,ty)=>(tx<0||tx>=LV.W||ty<0||ty>=LV.H)?' ':LV.t[ty][tx];
function solidAt(tx,ty){ if(tx<0||tx>=LV.W) return true; if(ty<0||ty>=LV.H) return false; const c=LV.t[ty][tx]; return c==='#'||c==='X'||c==='I'; }

function moveEntity(e,isPlayer){
  e.hitWall=0;
  e.x+=e.vx;
  const top=Math.floor(e.y/T), bot=Math.floor((e.y+e.h-1)/T);
  if(e.vx>0){ const tx=Math.floor((e.x+e.w-1)/T); for(let ty=top;ty<=bot;ty++) if(solidAt(tx,ty)){ e.x=tx*T-e.w; e.vx=0; e.hitWall=1; break; } }
  else if(e.vx<0){ const tx=Math.floor(e.x/T); for(let ty=top;ty<=bot;ty++) if(solidAt(tx,ty)){ e.x=(tx+1)*T; e.vx=0; e.hitWall=-1; break; } }

  const l=Math.floor(e.x/T), r=Math.floor((e.x+e.w-1)/T);
  if(e.vy>0){ const ty=Math.floor((e.y+e.h-1)/T);
    for(let tx=l;tx<=r;tx++){ const c=tileAt(tx,ty); const oneway=(c==='='||c==='S')&&prevBottom<=ty*T+0.5;
      if(solidAt(tx,ty)||oneway){ e.y=ty*T-e.h; e.vy=0; e.ground=true; e.landTile=c; e.landTx=tx; e.landTy=ty; break; } } }
  else if(e.vy<0){ const ty=Math.floor(e.y/T); for(let tx=l;tx<=r;tx++) if(solidAt(tx,ty)){ e.y=(ty+1)*T; e.vy=0; break; } }
}
function wallAt(dir){
  const tx=dir>0?Math.floor((P.x+P.w+1)/T):Math.floor((P.x-2)/T);

const overlap=(a,b,inset=0)=>a.x+inset<b.x+b.w&&a.x+a.w-inset>b.x&&a.y+inset<b.y+b.h&&a.y+a.h-inset>b.y;
function groundAhead(e){ const tx=Math.floor((e.x+(e.dir>0?e.w+1:-1))/T), ty=Math.floor((e.y+e.h+2)/T); const c=tileAt(tx,ty); return solidAt(tx,ty)||c==='='; }

function updPlayer(){

    else { P.vx=0; P.vy=0; }
  }
  if(!P.cling){
    if(dir){ P.vx+=dir*ACC*(P.ground?1:0.7); P.face=dir; }
    else { const f=P.ground?0.35:0.06; P.vx=Math.abs(P.vx)<=f?0:P.vx-Math.sign(P.vx)*f; }

    if(P.ground&&P.landTile==='S'){ P.vy=SPRING; P.spring=true; P.ground=false; springAnim[P.landTx+','+P.landTy]=t+12; sfx('spring'); }
    if(!P.ground&&!P.clingCD&&dir&&P.vy>-2.6&&wallAt(dir)){ P.cling=dir; P.face=dir; P.vx=0; P.vy=0; sfx('stick'); }

function updEnts(){

  sfx('boom'); shake=10;
  burst(cx0,cy0,30,['#FFFF55','#FFAA00','#FF5555','#FFFFFF'],3.5,36);
  for(const e of ents) if(e.alive&&e.enemy){ const dx=e.x+e.w/2-cx0, dy=e.y+e.h/2-cy0; if(dx*dx+dy*dy<(R+8)*(R+8)) kill(e); }
  const tx0=Math.floor((cx0-R)/T), tx1=Math.floor((cx0+R)/T), ty0=Math.floor((cy0-R)/T), ty1=Math.floor((cy0+R)/T);
  let broke=false;
  for(let ty=ty0;ty<=ty1;ty++) for(let tx=tx0;tx<=tx1;tx++){
    if(tileAt(tx,ty)!=='X') continue; const dx=tx*T+8-cx0, dy=ty*T+8-cy0;
    if(dx*dx+dy*dy<=R*R){ LV.t[ty][tx]=' '; addScore(50); burst(tx*T+8,ty*T+8,8,[THEMES[LV.theme].rock,THEMES[LV.theme].rockL],2.2,28); broke=true; }
  }
  if(broke) setTimeout(()=>sfx('break'),80);
}
function updParts(){
  for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life--; }
  parts=parts.filter(p=>p.life>0);
  for(const f of texts){ f.y-=0.5; f.life--; }
  texts=texts.filter(f=>f.life>0);
}
function updCam(){
  const tx=clamp(P.x+P.w/2-VW/2+P.face*24,0,LV.W*T-VW), ty=clamp(P.y+P.h/2-PH*0.55,0,LV.H*T-PH);
  camX+=(tx-camX)*0.12; camY+=(ty-camY)*0.12;
  camX=clamp(camX,0,Math.max(0,LV.W*T-VW)); camY=clamp(camY,0,Math.max(0,LV.H*T-PH));
}
function finishLevel(truck){
  if(state!=='play') return;
  state='levelEnd'; endT=0; P.hidden=true; hint=null; LV.truck=truck; sfx('honk');
  addScore(starsGot*100);
  if(lvlIndex+1>=saveData.unlocked) saveData.unlocked=Math.min(LEVELS.length,lvlIndex+2);
  saveData.best=Math.max(saveData.best,score); persist();

/* ---------------- step ---------------- */
function step(){
  t++;
  if(hit.has('mute')){ muted=!muted; }
  if(state==='title'){
    if(hit.has('left')) menuSel=(menuSel+saveData.unlocked-1)%saveData.unlocked;
    if(hit.has('right')) menuSel=(menuSel+1)%saveData.unlocked;
    if(hit.has('start')){ score=0; bombCount=0; P.maxHearts=3; loadLevel(menuSel); }
  } else if(state==='play'){
    if(hit.has('pause')){ state='pause'; }
    else { updPlayer(); updEnts(); updBombs(); updParts(); updCam(); if(shake>0) shake--; }
  } else if(state==='pause'){
    if(hit.has('pause')||hit.has('start')) state='play';
  } else if(state==='levelEnd'){
    endT++; updParts();
    const tr=LV.truck; if(endT>40){ tr.vx=Math.min((tr.vx||0)+0.08,4); tr.x+=tr.vx; if(endT%4===0) parts.push({x:tr.x+2,y:tr.y+tr.h-6,vx:-0.5,vy:-0.3,life:30,c:'#AAAAAA',g:-0.01}); }
    camX+=(clamp(tr.x+tr.w/2-VW/2,0,LV.W*T-VW)-camX)*0.08;
    if(endT>120&&(hit.has('start'))){
      if(lvlIndex+1<LEVELS.length){ loadLevel(lvlIndex+1); } else { state='win'; endT=0; sfx('win'); }
    }
  } else if(state==='win'){
    endT++; updParts();
    if(endT%25===0){ burst(rnd(40,VW-40),rnd(30,100),26,['#FF5555','#FFFF55','#55FFFF','#FF55FF','#55FF55','#FFFFFF'],2.6,60); tone(rnd(600,1200),0,0.05,'triangle',0.04); }
    if(endT>90&&hit.has('start')){ state='title'; menuSel=0; }
  }
  hit.clear();
}

function drawEnts(ox,oy){
  for(const e of ents){
    if(!e.alive) continue; const x=e.x-ox, y=e.y-oy; if(x<-80||x>VW+20||y<-140||y>PH+40) continue;
    switch(e.type){
      case 'blob': { const sq=Math.sin(e.t*0.2)>0?1:0; g.drawImage(S.blob,0,0,16,16,(x-1)|0,(y-6+sq)|0,16,16-sq); break; }
      case 'hopper': g.drawImage((e.dir>0?SL.hopper.r:SL.hopper.l),(x-2)|0,(y-3)|0); break;
      case 'buzz': g.drawImage((e.dir>0?SL.buzz.r:SL.buzz.l),(x-2)|0,(y-2+((e.t>>2)&1))|0); break;
      case 'plant': g.drawImage(S.plant,(x-2)|0,(y-2+((e.t>>4)&1))|0); break;
      case 'fruit': g.drawImage(e.img,(x-2)|0,(y+Math.sin((t+e.x)*0.08)*1.5)|0); break;
      case 'star': g.drawImage(S.star,(x-1)|0,(y+Math.sin((t+e.x)*0.1)*2)|0); break;
      case 'bomb': g.drawImage(S.bomb,(x-1)|0,(y-1)|0); break;
      case 'heart': g.drawImage(S.heart,x|0,(y+Math.sin(t*0.1)*1.5)|0); break;
      case 'pup': { const talk=hint&&hint.e===e&&(t>>3)&1; const face=P.x<e.x?'l':'r'; g.drawImage((talk?SL.pupOpen:SL.pup)[face],x|0,(y-((t>>4)&1&&!talk?1:0))|0); break; }
      case 'flag': g.fillStyle='#AAAAAA'; g.fillRect((x+1)|0,y|0,2,30); g.fillStyle=e.on?'#55FF55':'#FF5555'; { const wv=(t>>3)&1; g.fillRect((x+3)|0,(y+(e.on?0:14))|0,10,7); g.fillRect((x+13)|0,(y+(e.on?1:15)+wv)|0,2,5); } g.fillStyle='#FFFF55'; g.fillRect(x|0,(y-2)|0,4,3); break;
      case 'truck': drawTruck(e,ox,oy); break;
      case 'dino': drawDino(e,ox,oy); break;
    }
  }
  for(const b of bombs){ g.drawImage(S.bomb,(b.x-ox-3)|0,(b.y-oy-4)|0); if((b.fuse>>2)&1){ g.fillStyle='#FFFF55'; g.fillRect((b.x-ox+7)|0,(b.y-oy-4)|0,2,2); } }

  txt('YOU DID IT, KELLAN!',VW/2,40,12,'#FFFF55','center');
  txt('PUP SAYS: WOOF WOOF! BEST RESCUE EVER!',VW/2,64,6,'#55FFFF','center');
  txt('SCORE '+score,VW/2,84,9,'#FFFFFF','center');
  if(endT>90&&(t>>4)&1) txt(coarse?'TAP TO PLAY AGAIN':'PRESS ENTER',VW/2,108,7,'#FF55FF','center');
}

/* ---------------- sizing and loop ---------------- */
function resize(){
  const app=document.getElementById('app'), r=app.getBoundingClientRect();
  const aspect=r.width/Math.max(1,r.height);
  VW=clamp(Math.round(VH*aspect/2)*2,320,448);
  lo.width=VW; lo.height=VH; g=lo.getContext('2d'); g.imageSmoothingEnabled=false;
  let cw=r.width, ch=cw*VH/VW; if(ch>r.height){ ch=r.height; cw=ch*VW/VH; }
  cv.style.width=cw+'px'; cv.style.height=ch+'px';
  document.documentElement.style.setProperty('--hud',(innerHeight-(r.top+(r.height+ch)/2)+ch*(VH-PH)/VH)+'px');
  const dpr=Math.min(3,window.devicePixelRatio||1); cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr); SC=cv.height/VH;
  if(LV){ camX=clamp(camX,0,Math.max(0,LV.W*T-VW)); }
}
addEventListener('resize',resize); resize();
if(document.fonts&&document.fonts.load) document.fonts.load('8px "Press Start 2P"').catch(()=>{});
let acc=0, last=performance.now();
function frame(now){
  acc+=Math.min(100,now-last); last=now;
  while(acc>=1000/60){ step(); acc-=1000/60; }
  draw(); requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state==='play') state='pause'; });
requestAnimationFrame(frame);
})();
if('serviceWorker' in navigator)
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
